name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the static site, not .github / .vs, etc.
      # .nojekyll stops GitHub from running Jekyll, which can drop css/js and _shared folders.
      - name: Prepare site
        run: |
          mkdir -p _site/css _site/js
          cp index.html CNAME Background.mp3 _site/
          cp css/styles.css _site/css/
          cp js/main.js js/shader.js _site/js/
          cp -r _shared christian hindu muslim example _site/
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
